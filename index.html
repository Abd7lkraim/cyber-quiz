.action:hover {
    background: #0d47a1;
}

th {

.big-score {

.hidden {

/* =========================================================
   خلط أماكن الإجابات
   ========================================================= */

function shuffleAnswers(question) {

    let answers = question.options.map((text, index) => ({
        text: text,
        correct: index === question.answer
    }));

    for (let i = answers.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [answers[i], answers[j]] =
        [answers[j], answers[i]];
    }

    return answers;
}


/* =========================================================
   المتغيرات
   ========================================================= */

let currentQuestion = 0;

let score = 0;

let seconds = 25;

let timerInterval;

let startTime;

let currentAnswers = [];

let groupCorrect = 0;

let groupTimes = [];

let speedStats = {

    under3: 0,
    under5: 0,
    under7: 0,
    under10: 0,
    under15: 0,
    under25: 0,
    timeout: 0

};


/* =========================================================
   العناصر
   ========================================================= */

const progress = document.getElementById("progress");

const timer = document.getElementById("timer");

const question = document.getElementById("question");

const options = document.getElementById("options");

const status = document.getElementById("status");

const nextButton = document.getElementById("nextButton");

const game = document.getElementById("game");

const pauseScreen = document.getElementById("pauseScreen");

const resultScreen = document.getElementById("resultScreen");

const restartButton = document.getElementById("restartButton");


/* =========================================================
   تحميل السؤال
   ========================================================= */

function loadQuestion() {

    clearInterval(timerInterval);

    seconds = 25;

    timer.textContent = "25";

    status.textContent = "";

    nextButton.classList.add("hidden");

    progress.textContent =
        `السؤال ${currentQuestion + 1} من ${questionBank.length}`;

    question.textContent =
        questionBank[currentQuestion].q;

    options.innerHTML = "";

    currentAnswers =
        shuffleAnswers(questionBank[currentQuestion]);


    currentAnswers.forEach((item, index) => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            `${String.fromCharCode(65 + index)}. ${item.text}`;

        button.onclick = () =>
            selectAnswer(index);

        options.appendChild(button);

    });


    startTime = performance.now();


    timerInterval = setInterval(() => {

        seconds--;

        timer.textContent = seconds;


        if (seconds <= 0) {

            clearInterval(timerInterval);

            speedStats.timeout++;

            lockQuestion(
                "⏰ انتهى الوقت! تم قفل السؤال."
            );

        }

    }, 1000);

}


/* =========================================================
   تسجيل سرعة الإجابة
   ========================================================= */

function recordSpeed(time) {

    if (time < 3) {

        speedStats.under3++;

    } else if (time < 5) {

        speedStats.under5++;

    } else if (time < 7) {

        speedStats.under7++;

    } else if (time < 10) {

        speedStats.under10++;

    } else if (time < 15) {

        speedStats.under15++;

    } else {

        speedStats.under25++;

    }

}


/* =========================================================
   اختيار الإجابة
   ========================================================= */

function selectAnswer(index) {

    clearInterval(timerInterval);

    let elapsed =
        (performance.now() - startTime) / 1000;

    elapsed =
        Math.round(elapsed * 10) / 10;


    recordSpeed(elapsed);

    groupTimes.push(elapsed);


    [...options.children].forEach(button => {

        button.disabled = true;

    });


    if (currentAnswers[index].correct) {

        score++;

        groupCorrect++;

        status.textContent =
            `✅ إجابة صحيحة — زمنك ${elapsed.toFixed(1)} ثانية`;

    } else {

        status.textContent =
            `❌ إجابة غير صحيحة — زمنك ${elapsed.toFixed(1)} ثانية`;

    }


    nextButton.classList.remove("hidden");

}


/* =========================================================
   قفل السؤال
   ========================================================= */

function lockQuestion(message) {

    [...options.children].forEach(button => {

        button.disabled = true;

    });

    status.textContent = message;

    nextButton.classList.remove("hidden");

}


/* =========================================================
   السؤال التالي
   ========================================================= */

nextButton.onclick = function() {

    currentQuestion++;

    nextButton.classList.add("hidden");


    if (currentQuestion >= questionBank.length) {

        finishQuiz();

        return;

    }


    /*
       بعد كل 10 أسئلة
       تظهر صفحة النتائج
    */

    if (currentQuestion % 10 === 0) {

        showGroupResults();

    } else {

        loadQuestion();

    }

};


/* =========================================================
   صفحة نتيجة كل 10 أسئلة
   ========================================================= */

function showGroupResults() {

    game.classList.add("hidden");

    pauseScreen.classList.remove("hidden");


    let average = 0;

    if (groupTimes.length > 0) {

        average =
            groupTimes.reduce((a,b) => a + b, 0)
            / groupTimes.length;

        average =
            average.toFixed(1);

    }


    pauseScreen.innerHTML = `

        <h2>🏁 انتهت المجموعة</h2>

        <p>
            <strong>
            الأسئلة ${currentQuestion - 9}
            إلى ${currentQuestion}
            </strong>
        </p>

        <p class="big-score">
            ${groupCorrect} / 10
        </p>

        <p>
            متوسط زمن الإجابة:
            <strong>${average} ثانية</strong>
        </p>

        <button class="action" id="continueButton">
            ▶️ متابعة
        </button>

    `;


    document.getElementById("continueButton")
        .onclick = function() {

            groupCorrect = 0;

            groupTimes = [];

            pauseScreen.classList.add("hidden");

            game.classList.remove("hidden");

            loadQuestion();

        };

}


/* =========================================================
   النتيجة النهائية
   ========================================================= */

function finishQuiz() {

    clearInterval(timerInterval);

    game.classList.add("hidden");

    pauseScreen.classList.add("hidden");

    resultScreen.classList.remove("hidden");

    let percentage =
        Math.round(
            (score / questionBank.length) * 100
        );


    resultScreen.innerHTML = `

        <h2>🎉 انتهت المسابقة!</h2>

        <p class="big-score">
            ${score} / ${questionBank.length}
        </p>

        <p>
            النسبة:
            <strong>${percentage}%</strong>
        </p>


        <h3>⚡ إحصائية سرعة الإجابات</h3>

        <table>

            <tr>
                <th>زمن الإجابة</th>
                <th>عدد الأسئلة</th>
            </tr>

            <tr>
                <td>أقل من 3 ثوانٍ</td>
                <td>${speedStats.under3}</td>
            </tr>

            <tr>
                <td>من 3 إلى أقل من 5 ثوانٍ</td>
                <td>${speedStats.under5}</td>
            </tr>

            <tr>
                <td>من 5 إلى أقل من 7 ثوانٍ</td>
                <td>${speedStats.under7}</td>
            </tr>

            <tr>
                <td>من 7 إلى أقل من 10 ثوانٍ</td>
                <td>${speedStats.under10}</td>
            </tr>

            <tr>
                <td>من 10 إلى أقل من 15 ثانية</td>
                <td>${speedStats.under15}</td>
            </tr>

            <tr>
                <td>من 15 إلى 25 ثانية</td>
                <td>${speedStats.under25}</td>
            </tr>

            <tr>
                <td>انتهى الوقت</td>
                <td>${speedStats.timeout}</td>
            </tr>

        </table>

        <br>

        <p>
            🛡️ إنتاج: عبدالكريم الهياف
        </p>

        <p>
            Produced by: Abdulkarim Alhayaf
        </p>

    `;


    restartButton.classList.remove("hidden");

}


/* =========================================================
   إعادة المحاولة
   ========================================================= */

restartButton.onclick = function() {

    location.reload();

};


/* =========================================================
   بدء المسابقة
   ========================================================= */

loadQuestion();

</script>
